# ---------------------------------------------------------------------------
# Configuracao da aplicacao.
#
# NENHUM SEGREDO E NENHUM VALOR NORMATIVO NESTE ARQUIVO. Ele e versionado.
# Senha de banco e sal de pseudonimizacao vem de variavel de ambiente; tabelas
# normativas vem de importacao de CSV em tempo de execucao.
# ---------------------------------------------------------------------------

spring.application.name=auditoria-ibs-cbs

# Nao e aplicacao web: o contexto sobe, o comando roda e o processo encerra.
spring.main.web-application-type=none
spring.main.banner-mode=off

# ---------------------------------------------------------------------------
# Banco
#
# Sem valor padrao para usuario e senha. O sistema processa documento fiscal
# real; credencial escrita aqui viraria credencial de producao por descuido.
#
# Emenda de 04/10/2026: a primeira frase acima deixou de valer em 21/09/2026
# (192c802), quando as duas linhas abaixo passaram a trazer "auditoria" como
# usuario e senha padrao, dentro do placeholder. O mesmo vale para o cabecalho
# deste arquivo, que diz que a senha de banco vem de variavel de ambiente: sem a
# variavel, ela vem daqui. O texto original fica como registro da decisao; esta
# emenda corrige o que o comentario afirma e nao mexe nos padroes.
# ---------------------------------------------------------------------------
spring.datasource.url=${AUDITORIA_BANCO_URL:jdbc:postgresql://localhost:5432/auditoria}
spring.datasource.username= ${AUDITORIA_BANCO_USUARIO:auditoria}
spring.datasource.password=${AUDITORIA_BANCO_SENHA:auditoria}

# ---------------------------------------------------------------------------
# Flyway e o unico dono do esquema.
#
# O Hibernate nao cria, nao altera e nao valida nada: ddl-auto=none. A validacao
# automatica reclama de detalhe de tipo que nao importa aqui — as colunas
# numericas sao "numeric" sem precisao declarada de proposito, para preservar a
# escala do que foi declarado no documento — e falharia na subida por um motivo
# que nao e defeito. Quem garante que entidade e migration concordam e o teste
# de integracao, que grava e le todas as tabelas contra um PostgreSQL real.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Auditoria
#
# auditoria.tolerancia-de-valor  diferenca maxima, em reais, que a regra R05 nao
#                                aponta. E escolha de quem audita, e decide
#                                quanta divergencia some do relatorio. Use 0 para
#                                exigir igualdade exata. Vem de
#                                AUDITORIA_TOLERANCIA_DE_VALOR, ou da propriedade
#                                na linha de comando.
#
# auditoria.tolerancia-de-valor-padrao  o valor usado quando a instalacao nao
#                                configura a tolerancia. Emenda de 04/10/2026
#                                (D023): ate essa data este comentario dizia
#                                "NAO TEM PADRAO", e a linha da tolerancia trazia
#                                0.01 como padrao escondido no placeholder. Hoje o
#                                padrao fica nesta propriedade propria, e toda
#                                execucao grava o valor e a origem -- "padrao do
#                                sistema" ou "configurada na instalacao" --, que
#                                aparecem na CLI, na API, na planilha e na tela.
#
# auditoria.pseudonimizacao.sal  segredo da instalacao. Nao pode ser versionado:
#                                sal conhecido torna o pseudonimo reversivel.
#
#                                NAO E MAIS OBRIGATORIO DECLARAR (Etapa 10). Se
#                                esta propriedade e a variavel de ambiente
#                                AUDITORIA_PSEUDONIMIZACAO_SAL estiverem ambas
#                                vazias, o sistema le um arquivo local fora do
#                                repositorio -- em Windows sob %APPDATA%, fora
#                                dele sob ~/.config -- e, se nem ele existir,
#                                sorteia um sal de 256 bits, grava nesse arquivo
#                                e avisa no log.
#
#                                Continua nao havendo sal fixo em codigo: o sal
#                                sorteado e por instalacao, nao esta no jar e nao
#                                e versionado.
#
#                                TROCAR O SAL COM ACERVO GRAVADO E RECUSADO. O
#                                banco guarda a impressao digital do sal em uso
#                                (nunca o sal), e a subida para se ela nao bater.
#                                Rode "diagnosticar-sal" para ver a procedencia.
# ---------------------------------------------------------------------------
auditoria.tolerancia-de-valor=${AUDITORIA_TOLERANCIA_DE_VALOR:}
auditoria.tolerancia-de-valor-padrao=0.01

logging.level.root=WARN
logging.level.br.edu.tcc.auditoria=INFO
logging.pattern.console=%msg%n
