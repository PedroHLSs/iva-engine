# ---------------------------------------------------------------------------
# Perfil "api" — expoe por HTTP o que o sistema ja gravou (Etapa 8, D009) e, a
# partir da Etapa 11, recebe o XML a analisar.
#
# ATE A ETAPA 10 ESTE COMENTARIO DIZIA "SOMENTE PARA LEITURA", e isso deixou de
# ser verdade: POST /api/analises grava. A emenda e estreita, e o que continua
# fora da API e o que a D009 recusou por motivo que nao mudou -- importar
# catalogo, que decide o que o sistema afirma sobre a norma, e tratar achado,
# que e ato de uma pessoa identificada. Nao ha autenticacao aqui.
#
# NENHUM SEGREDO E NENHUM VALOR NORMATIVO NESTE ARQUIVO. Ele e versionado.
#
# COMO ATIVAR
#
# O perfil NAO pode entrar pela linha de argumentos. Argumentos.de (Etapa 5)
# exige "<comando> [--opcao=valor]" e recusa qualquer outra forma: um
# "--spring.profiles.active=api" na frente viraria "comando desconhecido", e
# atras viraria "o comando servir nao conhece a opcao". Entao ele entra por onde
# nao passa por main(String[]):
#
#   java -Dspring.profiles.active=api -jar auditoria-ibs-cbs-<versao>.jar servir
#   SPRING_PROFILES_ACTIVE=api java -jar auditoria-ibs-cbs-<versao>.jar servir
#
# SEM ESTE PERFIL, NADA MUDA. O application.properties mantem
# web-application-type=none, nenhum servidor sobe, e todo comando da CLI se
# comporta exatamente como antes da Etapa 8.
# ---------------------------------------------------------------------------

# Sobrepoe o "none" do application.properties: propriedade de perfil tem
# precedencia sobre a base.
spring.main.web-application-type=servlet

# ---------------------------------------------------------------------------
# Bind em localhost apenas.
#
# Nao ha autenticacao nesta etapa, e e por isso que a API nao escuta em
# interface de rede: quem alcanca a porta e quem ja esta na maquina. Trocar este
# endereco por 0.0.0.0 sem antes resolver autenticacao publica documento fiscal
# de uma empresa real para a rede inteira (D009).
#
# DESDE A ETAPA 11 ISSO PESA MAIS. Este bind deixou de segurar apenas leitura:
# atras dele ha um POST que grava. Quem alcancar a porta nao so le o acervo --
# tambem manda documento para dentro dele.
# ---------------------------------------------------------------------------
server.address=127.0.0.1
server.port=${AUDITORIA_API_PORTA:8080}

# ---------------------------------------------------------------------------
# Recebimento de arquivo (Etapa 11)
#
# O teto do contenedor corta antes de o arquivo chegar ao codigo, e a mensagem
# dele e generica; o codigo tem o proprio teto e a propria mensagem. Os dois
# existem de proposito: o primeiro protege a memoria do processo, o segundo
# explica para quem enviou.
#
# TEM PADRAO, ao contrario do sal e da tolerancia. A diferenca nao e de estilo:
# aqueles decidem o que o relatorio afirma, e escolher por conta propria seria
# decidir em nome de quem audita. Um teto de tamanho nao afirma nada sobre
# documento nenhum.
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${AUDITORIA_UPLOAD_TAMANHO_MAXIMO:64MB}
spring.servlet.multipart.max-request-size=${AUDITORIA_UPLOAD_TAMANHO_MAXIMO:64MB}

auditoria.upload.tamanho-maximo=${AUDITORIA_UPLOAD_TAMANHO_MAXIMO_BYTES:67108864}
auditoria.upload.entradas-maximas=${AUDITORIA_UPLOAD_ENTRADAS_MAXIMAS:5000}
auditoria.upload.tamanho-maximo-por-entrada=${AUDITORIA_UPLOAD_POR_ENTRADA:16777216}
auditoria.upload.total-descomprimido-maximo=${AUDITORIA_UPLOAD_TOTAL_DESCOMPRIMIDO:536870912}
auditoria.upload.razao-de-compressao-maxima=${AUDITORIA_UPLOAD_RAZAO_MAXIMA:500}
auditoria.upload.piso-para-conferir-razao=${AUDITORIA_UPLOAD_PISO_DA_RAZAO:1048576}

# ---------------------------------------------------------------------------
# Serializacao
#
# default-property-inclusion=always e LOAD-BEARING, nao gosto pessoal: campo
# ausente da resposta faria o consumidor concluir por subtracao, e a Etapa 8
# existe para impedir exatamente isso. Ausencia e null COM um campo irmao
# dizendo por que. Trocar isto por NON_NULL quebra a propriedade central da
# etapa, e os testes de contrato acusam.
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# ---------------------------------------------------------------------------
# Privacidade: os dois campos que a CLI mostra e a API NAO mostra por padrao.
#
# expor-chave-de-acesso  a chave carrega o CNPJ do emitente nos digitos
#                        intermediarios, por definicao do leiaute (D005). Por
#                        padrao a resposta traz so o pseudonimo, calculado com o
#                        mesmo sal de instalacao do papel de trabalho (D007).
#
# expor-justificativa    texto livre digitado por pessoa, sem sanitizacao, que
#                        pode conter CNPJ ou razao social. Por padrao e omitido,
#                        com o motivo escrito no lugar.
#
# expor-descricao-do-produto
#                        o xProd do XML. E o pior dos tres neste aspecto: vem da
#                        fonte, em escala, e ninguem revisou. Na pratica traz
#                        nome de cliente, referencia de pedido, numero de
#                        contrato. Quem grava ja substitui corrida de 44 digitos
#                        pelo marcador, mas nenhuma regra de forma alcanca prosa.
#
#                        Ligar esta propriedade e o que faz a tela de detalhe
#                        mostrar a descricao da nota ao lado da descricao do NCM
#                        no catalogo. A comparacao entre as duas e sinal de
#                        classificacao errada, e nenhuma das duas sozinha da essa
#                        informacao. Desligada, a tela mostra so a do catalogo,
#                        com o motivo escrito no lugar da outra.
#
# Sao configuracao, e nao query param: quem consome a API nao escolhe quanto
# dado pessoal recebe. Ver D009.
#
# NENHUMA DELAS AFETA A EXPORTACAO. O papel de trabalho nunca leva chave em texto
# claro nem descricao de produto, ligadas ou nao: planilha e arquivo que sai da
# maquina, e o guarda de vazamento da Etapa 6 confere isso a cada exportacao.
# ---------------------------------------------------------------------------
auditoria.api.expor-chave-de-acesso=${AUDITORIA_API_EXPOR_CHAVE_DE_ACESSO:false}
auditoria.api.expor-justificativa=${AUDITORIA_API_EXPOR_JUSTIFICATIVA:false}
auditoria.api.expor-descricao-do-produto=${AUDITORIA_API_EXPOR_DESCRICAO_DO_PRODUTO:false}
